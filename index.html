<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87c5f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  /* ---------- HUD ---------- */
  #hud {
    position:fixed; top:0; left:0; right:0; padding:14px 18px;
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    pointer-events:none; z-index:10;
  }
  .stat {
    background:rgba(12,18,32,.62); backdrop-filter:blur(8px);
    color:#eaf2ff; padding:8px 16px; border-radius:12px;
    font-size:15px; font-weight:600; letter-spacing:.3px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 4px 18px rgba(0,0,0,.25);
  }
  .stat b { color:#ffd75e; font-size:18px; }

  /* ---------- Boost bar ---------- */
  #boostUI {
    position:fixed; left:50%; bottom:190px; transform:translateX(-50%);
    width:min(340px, 70vw); z-index:10; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  #boostUI.on { opacity:1; }
  #fuelTrack {
    height:14px; background:rgba(12,18,32,.6); border-radius:8px;
    border:1px solid rgba(255,255,255,.15); overflow:hidden;

    height:100%; width:100%;

    text-align:center; color:#fff; font-size:12px; font-weight:700;
    margin-top:6px; text-shadow:0 2px 6px rgba(0,0,0,.5); letter-spacing:1px;

  /* ---------- Bottom panel ---------- */
  #panel {
    position:fixed; left:0; right:0; bottom:0; padding:14px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    z-index:10; pointer-events:none;
  }
  #shop {
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    pointer-events:auto; max-width:900px;
  }
  .upg {
    display:flex; align-items:center; gap:9px;
    background:rgba(12,18,32,.72); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:14px;
    padding:8px 12px; cursor:pointer; color:#eaf2ff;
    font-family:inherit; text-align:left; transition:.15s;
    box-shadow:0 4px 16px rgba(0,0,0,.28);
  }
  .upg:hover:not(.disabled) { border-color:#ffd75e; transform:translateY(-2px); }
  .upg.disabled { opacity:.42; cursor:not-allowed; }
  .u-icon { font-size:22px; }
  .u-name { font-size:13px; font-weight:700; white-space:nowrap; }
  .u-lvl  { color:#ffd75e; font-size:11px; }
  .u-desc { font-size:10px; opacity:.6; white-space:nowrap; }
  .u-cost { font-size:13px; font-weight:800; color:#ffd75e; margin-left:4px; }

  #launch {
    pointer-events:auto; font-family:inherit;
    font-size:20px; font-weight:900; letter-spacing:1.5px;
    padding:16px 54px; border-radius:16px; border:none; cursor:pointer;
    color:#20130a; background:linear-gradient(180deg,#ffd75e,#ff9f1a);
    box-shadow:0 8px 0 #b96a00, 0 12px 28px rgba(0,0,0,.35);
    transition:.08s; text-transform:uppercase;
  }
  #launch:active { transform:translateY(5px); box-shadow:0 3px 0 #b96a00, 0 6px 16px rgba(0,0,0,.35); }
  #launch.hidden { display:none; }

  #toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.7);
    font-size:52px; font-weight:900; color:#fff; z-index:20;
    text-shadow:0 6px 30px rgba(0,0,0,.6); opacity:0;
    pointer-events:none; transition:.35s cubic-bezier(.2,1.6,.5,1);
    white-space:nowrap;
  }
  #toast.on { opacity:1; transform:translate(-50%,-50%) scale(1); }

  @media (max-width:640px) {
    .u-desc { display:none; }
    .u-name { font-size:11px; }
    #launch { font-size:17px; padding:14px 40px; }
    #boostUI { bottom:150px; }
  }

  #touchControls {
  position:fixed; left:0; right:0; bottom:20px; padding:0 20px;
  display:flex; justify-content:flex-start; z-index:11;
  pointer-events:none;
}
#touchControls.hidden { display:none; }
#rotBtns { display:flex; flex-direction:column; gap:10px; pointer-events:auto; }
.tbtn {
  width:66px; height:66px; border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(12,18,32,.72); backdrop-filter:blur(10px);
  color:#eaf2ff; font-size:24px; font-weight:900;
  font-family:inherit; cursor:pointer;
  touch-action:none; user-select:none;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:.1s;
}
.tbtn:active { transform:scale(.92); background:rgba(255,215,94,.3); }
</style>

<div id="hud">
  <div class="stat">📏 <b id="dist">0</b> м</div>
  <div class="stat">🪙 <b id="coins">0</b></div>

</div>

<div id="boostUI">

  🔥 <span id="fuelText">0.0</span> с

</div>
</div>

<div id="panel">
  <div id="shop"></div>

</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

/* ================================================================
   1. RENDERER / SCENE / CAMERA
================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const SKY = 0x8ec9f2;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 55, 260);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(6, 8, 26);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================================================================
   2. LIGHTS
================================================================ */
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a7a35, 1.15));

const sun = new THREE.DirectionalLight(0xfff3d6, 2.0);
sun.position.set(20, 45, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45;
sc.near = 1; sc.far = 160;
sun.shadow.bias = -0.0008;
scene.add(sun);
scene.add(sun.target);

/* ================================================================
   3. TERRAIN HEIGHT FUNCTION + GROUND MESH
================================================================ */

// Высотная функция: сумма синусов = пологие холмы + низины
function terrainBase(x, z) {
  let h = 0;
  h += Math.sin(x * 0.016 + 0.4) * 5.5;          // крупные холмы
  h += Math.sin(x * 0.041 + 1.9) * 2.4;          // средние
  h += Math.cos(z * 0.020 + 0.8) * 3.0;          // поперёк трассы
  h += Math.sin((x + z * 0.8) * 0.011 + 2.5) * 4.0; // диагональные волны
  h += Math.sin(x * 0.085 + 3.1) * 0.9;          // мелкие бугры
  h += Math.cos(z * 0.10 + 1.4) * 0.7;
  const dip = Math.max(0, Math.sin(x * 0.0075 + 1.2));
  h -= dip * dip * 5.5;                          // редкие низины
  return h;
}

// Плоская площадка вокруг босса, дальше — рельеф
function terrainHeight(x, z) {
  const d = Math.hypot(x + 2.6, z);
  const flat = Math.min(1, Math.max(0, (d - 6) / 14));
  return terrainBase(x, z) * flat;
}

// --- Земля ---
const TILE = 6;
const GX0 = -200, GX1 = 4000, GZ0 = -150, GZ1 = 150;
const GW = GX1 - GX0, GH = GZ1 - GZ0;
const GSEG_X = 600, GSEG_Z = 60;
const GCX = (GX0 + GX1) / 2, GCZ = (GZ0 + GZ1) / 2;

function makeGroundTexture() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6cbf4a';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 420; i++) {
    ctx.fillStyle = Math.random() > .5 ? 'rgba(0,0,0,0.045)' : 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.arc(Math.random() * s, Math.random() * s, 3 + Math.random() * 16, 0, 6.284);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 1.5); ctx.lineTo(s, 1.5);
  ctx.moveTo(1.5, 0); ctx.lineTo(1.5, s);
  ctx.stroke();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const groundTex = makeGroundTexture();
groundTex.repeat.set(GW / TILE, GH / TILE);

const groundGeo = new THREE.PlaneGeometry(GW, GH, GSEG_X, GSEG_Z);
groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const wx = pos.getX(i) + GCX;
    const wz = pos.getZ(i) + GCZ;
    pos.setY(i, terrainHeight(wx, wz));
  }
  pos.needsUpdate = true;
  groundGeo.computeVertexNormals();
}

const ground = new THREE.Mesh(
  groundGeo,
  new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, metalness: 0 })
);
ground.position.set(GCX, 0, GCZ);
ground.receiveShadow = true;
scene.add(ground);

/* ================================================================
   4. PROPS: деревья, кусты, камни
================================================================ */
const props = [];

const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x7a4a24, roughness: .95 });
const treeLeafMats = [
  new THREE.MeshStandardMaterial({ color: 0x2f7d32, roughness: .9 }),
  new THREE.MeshStandardMaterial({ color: 0x3f9440, roughness: .9 }),
  new THREE.MeshStandardMaterial({ color: 0x256b2a, roughness: .9 }),
];
const rockMatA = new THREE.MeshStandardMaterial({ color: 0x8a8479, roughness: 1, flatShading: true });
const rockMatB = new THREE.MeshStandardMaterial({ color: 0x6e6a63, roughness: 1, flatShading: true });
const rockGeo  = new THREE.IcosahedronGeometry(1, 0);

function makePine() {
  const g = new THREE.Group();
  const h = 2 + Math.random() * 3;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18, .26, h, 6), treeTrunkMat);
  trunk.position.y = h / 2; trunk.castShadow = true; g.add(trunk);
  const leafMat = treeLeafMats[(Math.random() * 3) | 0];
  const layers = 2 + ((Math.random() * 2) | 0);
  for (let i = 0; i < layers; i++) {
    const r = (1.5 - i * 0.35) * (0.8 + Math.random() * 0.4);
    const lh = 1.7 - i * 0.15;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, lh, 7), leafMat);
    cone.position.y = h + i * (lh * 0.5) + lh * 0.3;
    cone.castShadow = true; g.add(cone);
  }
  g.scale.setScalar(0.75 + Math.random() * 0.8);
  return g;
}

function makeOak() {
  const g = new THREE.Group();
  const th = 1.8 + Math.random() * 1.2;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.22, .34, th, 6), treeTrunkMat);
  trunk.position.y = th / 2; trunk.castShadow = true; g.add(trunk);
  const mat = treeLeafMats[(Math.random() * 3) | 0];
  const blobs = 3 + ((Math.random() * 3) | 0);
  for (let i = 0; i < blobs; i++) {
    const r = 0.85 + Math.random() * 0.7;
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), mat);
    s.position.set((Math.random() - .5) * 1.4, th + 0.6 + Math.random() * 1.1, (Math.random() - .5) * 1.4);
    s.castShadow = true; g.add(s);
  }
  g.scale.setScalar(0.85 + Math.random() * 0.6);
  return g;
}

function makeBush() {
  const g = new THREE.Group();
  const mat = treeLeafMats[(Math.random() * 3) | 0];
  const blobs = 2 + ((Math.random() * 2) | 0);
  for (let i = 0; i < blobs; i++) {
    const r = 0.5 + Math.random() * 0.4;
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5), mat);
    s.position.set((Math.random() - .5) * 0.9, r * 0.8, (Math.random() - .5) * 0.9);
    s.castShadow = true; g.add(s);
  }
  g.scale.setScalar(0.8 + Math.random() * 0.7);
  return g;
}

function makeRock() {
  const g = new THREE.Group();
  const mat = Math.random() > 0.5 ? rockMatA : rockMatB;
  const m = new THREE.Mesh(rockGeo, mat);
  m.scale.set(1, 0.7 + Math.random() * 0.5, 1);
  m.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  if (Math.random() > 0.5) {
    const m2 = new THREE.Mesh(rockGeo, mat);
    m2.scale.setScalar(0.4 + Math.random() * 0.4);
    m2.position.set(0.9 + Math.random() * 0.6, 0, 0.3);
    m2.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
    m2.castShadow = true; g.add(m2);
  }
  g.scale.setScalar(0.6 + Math.random() * 1.4);
  return g;
}

function spawnProps(factory, count, xSpan = [-100, 1900]) {
  for (let i = 0; i < count; i++) {
    const m = factory();
    m.position.x = xSpan[0] + Math.random() * (xSpan[1] - xSpan[0]);
    m.position.z = (Math.random() - .5) * 200;

    // Не сажаем ничего в радиусе 16 м от босса
    const d = Math.hypot(m.position.x + 2.6, m.position.z);
    if (d < 16) continue;

    m.position.y = terrainHeight(m.position.x, m.position.z);
    scene.add(m);
    props.push(m);
  }
}

spawnProps(makePine, 200, [-100, 1900]);
spawnProps(makeOak,  150, [-100, 1900]);
spawnProps(makeBush, 250, [-100, 1900]);
spawnProps(makeRock, 180, [-100, 1900]);

/* ================================================================
   5. BOSS (босс из коробок)
================================================================ */
const boss = new THREE.Group();
boss.position.set(-2.6, 0, 0);

const skinMat   = new THREE.MeshStandardMaterial({ color: 0xd94f6b, roughness: .55 });
const darkMat   = new THREE.MeshStandardMaterial({ color: 0x2b2233, roughness: .8 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0xffd75e, roughness: .4, metalness: .3 });

function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// Торс
const torso = box(2.0, 2.4, 1.4, skinMat);
torso.position.y = 3.8;
boss.add(torso);

// Грудь-акцент
const chest = box(1.1, 0.9, 0.15, accentMat);
chest.position.set(0, 4.0, 0.75);
boss.add(chest);

// Голова
const head = box(1.25, 1.2, 1.2, skinMat);
head.position.y = 5.7;
boss.add(head);

// Глаза
for (const zz of [0.62, -0.62]) {
  const eye = box(0.3, 0.22, 0.1, darkMat);
  eye.position.set(0.3, 5.85, zz);
  eye.rotation.y = 0;
  boss.add(eye);
}
// Брови (злые)
const brow = box(0.36, 0.1, 0.12, darkMat);
brow.position.set(0.32, 6.05, 0.62); brow.rotation.z = -0.35; boss.add(brow);
const brow2 = brow.clone(); brow2.position.z = -0.62; brow2.rotation.z = 0.35; boss.add(brow2);

// Руки
const armL = box(0.55, 2.1, 0.55, skinMat);
armL.position.set(0, 3.6, 1.05);
armL.geometry.translate(0, -1.05, 0);
armL.position.y = 4.7;
boss.add(armL);

const armR = box(0.55, 2.1, 0.55, skinMat);
armR.geometry.translate(0, -1.05, 0);
armR.position.set(0, 4.7, -1.05);
boss.add(armR);

// Ноги — пивот в бедре
function makeLeg() {
  const pivot = new THREE.Group();
  const upper = box(0.72, 1.4, 0.72, darkMat);
  upper.position.y = -0.7;
  pivot.add(upper);
  const lower = box(0.62, 1.3, 0.62, darkMat);
  lower.position.y = -2.0;
  pivot.add(lower);
  const foot = box(0.85, 0.4, 0.95, accentMat);
  foot.position.set(0.18, -2.75, 0);
  pivot.add(foot);
  return pivot;
}

const legBack = makeLeg();
legBack.position.set(0, 2.6, -0.5);
boss.add(legBack);

const legKick = makeLeg();
legKick.position.set(0, 2.6, 0.5);
boss.add(legKick);

scene.add(boss);

/* ================================================================
   6. ROCKET
================================================================ */
const rocket = new THREE.Group();

const bodyMat   = new THREE.MeshStandardMaterial({ color: 0xf2f4f8, metalness: .55, roughness: .3 });
const redMat    = new THREE.MeshStandardMaterial({ color: 0xe63946, metalness: .3, roughness: .45 });
const glassMat  = new THREE.MeshStandardMaterial({ color: 0x2b3a55, metalness: .9, roughness: .15 });

// Корпус
const rBody = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 2.2, 16), bodyMat);
rBody.rotation.z = Math.PI / 2;
rBody.castShadow = true;
rocket.add(rBody);

// Нос
const rNose = new THREE.Mesh(new THREE.ConeGeometry(0.36, 1.0, 16), redMat);
rNose.rotation.z = -Math.PI / 2;
rNose.position.x = 1.6;
rNose.castShadow = true;
rocket.add(rNose);

// Иллюминатор
const port = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.06, 12), glassMat);
port.rotation.x = Math.PI / 2;
port.position.set(0.5, 0.3, 0.33);
rocket.add(port);

// Плавники
const finShape = new THREE.Shape();
finShape.moveTo(0, 0);
finShape.lineTo(-1.0, 0);
finShape.lineTo(-1.0, 0.55);
finShape.closePath();
const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.07, bevelEnabled: false });
finGeo.translate(0, 0, -0.035);

for (const sgn of [1, -1]) {
  const fin = new THREE.Mesh(finGeo, redMat);
  fin.position.set(-0.35, 0.34 * sgn, 0);
  fin.scale.y = sgn;
  fin.castShadow = true;
  rocket.add(fin);
}

// Сопло
const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.5, 0.5, 14), darkMat);
nozzle.rotation.z = Math.PI / 2;
nozzle.position.x = -1.25;
rocket.add(nozzle);

// Пламя
const flameMat = new THREE.MeshBasicMaterial({ color: 0xffb703, transparent: true, opacity: .95 });
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.36, 1.4, 12), flameMat);
flame.rotation.z = Math.PI / 2;
flame.position.x = -2.1;
rocket.add(flame);

const flameInner = new THREE.Mesh(
  new THREE.ConeGeometry(0.2, 0.9, 10),
  new THREE.MeshBasicMaterial({ color: 0xfff6d0 })
);
flameInner.rotation.z = Math.PI / 2;
flameInner.position.x = -1.85;
rocket.add(flameInner);

const exhaustLight = new THREE.PointLight(0xff9a3c, 0, 14);
exhaustLight.position.set(-2.0, 0, 0);
rocket.add(exhaustLight);

scene.add(rocket);



/* ================================================================
   7. GAME STATE
================================================================ */
const GRAVITY = 9.8;                                       // м/с² — как в реальности
const REST_Y  = 0.95;
const LAUNCH_ANGLE = 20 * Math.PI / 180;                  // ~20° — оптимальный угол старта

// --- Угловая динамика (поворот носа W/S) ---
const ANG_ACC  = 8.0;   // рад/с² — угловое ускорение от клавиши
const ANG_DAMP = 0.8;    // 1/с   — вязкое затухание (чем больше — тем «гуще»)
const ANG_MAX  = 18.0;    // рад/с — предохранитель от разгона

const G = {
  phase: 'ready',        // ready | windup | strike | fly | landed
  timer: 0,
  coins: 0,
  best: 0,
  lastDist: 0,
  fuel: 0,
  upgrades: { power: 1, aero: 1, fuel: 1, thrust: 1 },
};

const rocketState = {
  pos: new THREE.Vector3(0, REST_Y, 0),
  vel: new THREE.Vector3(),
  angVel: 0,   // угловая скорость носа, рад/с
};

let boosting = false;
let prevPhase = '';

const UPGRADES = [
  { key: 'power',  icon: '🦵', name: 'Сила пинка',     desc: 'Дальше и выше',      base: 40, growth: 1.60 },
  { key: 'aero',   icon: '🪶', name: 'Аэродинамика',   desc: 'Меньше торможения',  base: 45, growth: 1.60 },
  { key: 'fuel',   icon: '⛽', name: 'Бак топлива',     desc: 'Дольше ускорение',   base: 35, growth: 1.55 },
  { key: 'thrust', icon: '🔥', name: 'Тяга двигателя', desc: 'Сильнее ускорение',  base: 50, growth: 1.65 },
];

const costOf   = u => Math.floor(u.base * Math.pow(u.growth, G.upgrades[u.key] - 1));

// Сила пинка — стартовая скорость в м/с
const launchSpeed = () => 20 + G.upgrades.power * 6;        // Lv1: 26, Lv10: 80 м/с

// Бак — топливо в СЕКУНДАХ буста
const maxFuel  = () => 2.0 + (G.upgrades.fuel - 1) * 0.45;  // Lv1: 2.0с, Lv10: 6.05с

// Тяга — чистое ускорение в м/с² вдоль носа ракеты
const thrustAcc= () => 12 + (G.upgrades.thrust - 1) * 4;    // Lv1: 12, Lv10: 48 м/с²

// Сопротивление воздуха: a_drag = k · v²  (квадратичное, как в аэродинамике)
const dragCoef = () => 0.0025 / (1 + (G.upgrades.aero - 1) * 0.40);  // 1/м

// Плотность воздуха падает с высотой — на высоте 400 м она уже 37% от земной.
// Это даёт ощущение «выше забрался — меньше тормозит».
const airDensity = (y) => Math.exp(-Math.max(0, y) / 400);



/* ================================================================
   8. UI
================================================================ */
const $dist    = document.getElementById('dist');
const $coins   = document.getElementById('coins');
const $best    = document.getElementById('best');
const $shop    = document.getElementById('shop');
const $launch  = document.getElementById('launch');
const $boostUI = document.getElementById('boostUI');
const $fuelFill= document.getElementById('fuelFill');
const $fuelText= document.getElementById('fuelText');
const $alignText = document.getElementById('alignText');
const $touchUI = document.getElementById('touchControls');
const $toast   = document.getElementById('toast');

function updateHUD() {
  $dist.textContent  = Math.max(0, Math.floor(rocketState.pos.x));
  $coins.textContent = G.coins;
  $best.textContent  = Math.floor(G.best);
}

function renderShop() {
  $shop.innerHTML = '';
  for (const u of UPGRADES) {
    const lvl  = G.upgrades[u.key];
    const cost = costOf(u);
    const can  = G.coins >= cost;

    const btn = document.createElement('button');
    btn.className = 'upg' + (can ? '' : ' disabled');
    btn.innerHTML = `
      <div class="u-icon">${u.icon}</div>
      <div>
        <div class="u-name">${u.name} <span class="u-lvl">Lv.${lvl}</span></div>
        <div class="u-desc">${u.desc}</div>
      </div>
      <div class="u-cost">🪙 ${cost}</div>`;
    btn.addEventListener('click', () => buy(u));
    $shop.appendChild(btn);
  }
}

function buy(u) {
  const cost = costOf(u);
  if (G.coins < cost) return;
  G.coins -= cost;
  G.upgrades[u.key]++;
  updateHUD();
  renderShop();
  showToast(`${u.icon} Lv.${G.upgrades[u.key]}`, '#ffd75e');
}

let toastTimer;
function showToast(text, color = '#fff') {
  $toast.textContent = text;
  $toast.style.color = color;
  $toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('on'), 900);
}

/* ================================================================
   9. INPUT
================================================================ */
const input = { boost: false };
const keys       = { W: false, S: false };  // клавиатура
const touchKeys  = { W: false, S: false };  // тач-кнопки

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    input.boost = true;
    if (G.phase === 'ready' || G.phase === 'landed') startKick();
  }
  if (e.code === 'KeyW') { keys.W = true; e.preventDefault(); }
  if (e.code === 'KeyS') { keys.S = true; e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (e.code === 'Space') input.boost = false;
  if (e.code === 'KeyW') keys.W = false;
  if (e.code === 'KeyS') keys.S = false;
});

// --- Тач-кнопки поворота ---
const $rotUp    = document.getElementById('rotUp');
const $rotDown  = document.getElementById('rotDown');

function bindHold(el, setter) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); setter(true); });
  el.addEventListener('pointerup',   () => setter(false));
  el.addEventListener('pointerleave',() => setter(false));
  el.addEventListener('pointercancel',() => setter(false));
}
bindHold($rotUp,   v => touchKeys.W = v);
bindHold($rotDown, v => touchKeys.S = v);

// Тап/клик по сцене
renderer.domElement.addEventListener('pointerdown', e => {
  if (G.phase === 'fly') { input.boost = true; }
  else if (G.phase === 'ready' || G.phase === 'landed') { startKick(); }
});
addEventListener('pointerup', () => { input.boost = false; });
addEventListener('pointercancel', () => { input.boost = false; });

$launch.addEventListener('click', e => {
  e.stopPropagation();
  if (G.phase === 'ready' || G.phase === 'landed') startKick();
});

/* ================================================================
   10. GAME LOGIC
================================================================ */
function startKick() {
  if (G.phase !== 'ready' && G.phase !== 'landed') return;
  resetRocket();
  G.phase = 'windup';
  G.timer = 0;
    $launch.classList.add('hidden');
  $shop.style.display = 'none';
}

function resetRocket() {
  const gY = terrainHeight(0, 0);
  rocketState.pos.set(0, gY + REST_Y, 0);
  rocketState.vel.set(0, 0, 0);
  rocket.rotation.z = 0;
  rocketState.angVel = 0;
  rocket.position.copy(rocketState.pos);
  G.fuel = maxFuel();
  input.boost = false;
}

function launch() {
  const speed = launchSpeed();
  rocketState.vel.set(
    Math.cos(LAUNCH_ANGLE) * speed,
    Math.sin(LAUNCH_ANGLE) * speed,
    0
  );
  // Мгновенно ставим ракету под угол старта — она «вылетает из-под ноги» как надо
  rocket.rotation.z = LAUNCH_ANGLE;
  rocketState.angVel = 0;
  G.phase = 'fly';
  G.timer = 0;
  boosting = false;
  showToast('ПОЛЕТЕЛИ! 🚀', '#ffd75e');
}

function land() {
  G.phase = 'landed';
  G.timer = 0;
  rocketState.angVel = 0;
  const gY = terrainHeight(rocketState.pos.x, rocketState.pos.z);
  rocketState.pos.y = gY + REST_Y;
  rocketState.vel.set(0, 0, 0);

  const dist   = Math.max(0, rocketState.pos.x);
  const earned = Math.max(1, Math.floor(dist));
  G.lastDist = dist;
  G.coins += earned;
  if (dist > G.best) G.best = dist;

  updateHUD();
  renderShop();

  $launch.classList.remove('hidden');
  $shop.style.display = '';
  $launch.textContent = 'Пнуть снова! 🦵';

  showToast(`${Math.floor(dist)} м  +${earned} 🪙`, '#7dffa0');

  // Тряска камеры
  shake = 0.9;
}

let shake = 0;

/* ================================================================
   11. UPDATE
================================================================ */
function update(dt) {
  updateBoss(dt);
  updateRocket(dt);
  updateCamera(dt);
  updateScenery();

  // Топливный бар
  if (G.phase === 'fly') {
    $boostUI.classList.add('on');
    $touchUI.classList.remove('hidden');
    $fuelFill.style.width = (G.fuel / maxFuel() * 100) + '%';
    $fuelText.textContent = G.fuel.toFixed(1);
  } else {
    $boostUI.classList.remove('on');
    $touchUI.classList.add('hidden');
  }

  if (G.phase === 'fly') updateHUD();
}

/* ---------- Boss ---------- */
function updateBoss(dt) {
  const idle = performance.now() * 0.0022;

  if (G.phase === 'ready' || G.phase === 'landed') {
    legKick.rotation.z += (0 - legKick.rotation.z) * Math.min(1, dt * 12);
    boss.position.y = Math.sin(idle) * 0.08;
    torso.rotation.z = Math.sin(idle * 0.7) * 0.03;
    head.rotation.z  = Math.sin(idle * 0.7) * 0.05;
    legBack.rotation.z = Math.sin(idle) * 0.03;
  }
  else if (G.phase === 'windup') {
    G.timer += dt;
    const t = Math.min(1, G.timer / 0.30);
    const e = 1 - Math.pow(1 - t, 3);
    legKick.rotation.z = -0.85 * e;
    torso.rotation.z = 0.12 * e;
    boss.position.y = -0.12 * e;

     if (t >= 1) {
      G.phase = 'strike';
      G.timer = 0;
    }
  }
  else if (G.phase === 'strike') {
    G.timer += dt;
    const t = Math.min(1, G.timer / 0.11);
    const e = t * t * (3 - 2 * t);
    legKick.rotation.z = -0.85 + (2.05 + 0.85) * e;
    torso.rotation.z = 0.12 - 0.28 * e;
    boss.position.y = -0.12 + 0.20 * e;

    if (t >= 1 && G.phase === 'strike') launch();
  }
  else if (G.phase === 'fly') {
    legKick.rotation.z += (0 - legKick.rotation.z) * Math.min(1, dt * 6);
    torso.rotation.z += (0 - torso.rotation.z) * Math.min(1, dt * 6);
    boss.position.y += (0 - boss.position.y) * Math.min(1, dt * 6);
  }
}

/* ---------- Rocket ---------- */
function updateRocket(dt) {
  const p = rocketState;
  const restY = terrainHeight(p.pos.x, p.pos.z) + REST_Y;

  if (G.phase === 'fly') {
    // --- Тяга: вектор вдоль носа ракеты (а не всегда вправо!) ---
    boosting = input.boost && G.fuel > 0;
    if (boosting) {
      const ta  = thrustAcc();
      const ang = rocket.rotation.z;
      p.vel.x += Math.cos(ang) * ta * dt;
      p.vel.y += Math.sin(ang) * ta * dt;
      G.fuel = Math.max(0, G.fuel - dt);   // 1 секунда буста = 1 секунда топлива
    }

    // --- Гравитация ---
    p.vel.y -= GRAVITY * dt;

    // --- Сопротивление воздуха: a = k·ρ(y)·v² , действует против вектора скорости ---
    const speed = p.vel.length();
    if (speed > 0.01) {
      const k = dragCoef() * airDensity(p.pos.y);
      const aDrag = k * speed;             // 1/с (умножится на v ещё раз ниже)
      p.vel.x -= p.vel.x * aDrag * dt;
      p.vel.y -= p.vel.y * aDrag * dt;
    }

    // --- Интеграция ---
    p.pos.addScaledVector(p.vel, dt);

    if (p.pos.y <= restY && p.vel.y < 0) {
      p.pos.y = restY;
      land();
    }  
  } else if (G.phase === 'landed') {
    p.pos.y += (restY - p.pos.y) * Math.min(1, dt * 8);
    rocket.rotation.z += (0 - rocket.rotation.z) * Math.min(1, dt * 6);
  }

  rocket.position.copy(p.pos);

  // --- Угловая динамика: игрок управляет носом, вязкое затухание ---
  if (G.phase === 'fly') {
    const rotInput =
      ((keys.W || touchKeys.W) ? 1 : 0) -
      ((keys.S || touchKeys.S) ? 1 : 0);

    p.angVel += rotInput * ANG_ACC * dt;
    p.angVel -= p.angVel * ANG_DAMP * dt;              // вязкое трение
    p.angVel = Math.max(-ANG_MAX, Math.min(ANG_MAX, p.angVel));

    rocket.rotation.z += p.angVel * dt;
  }

  // --- Индикатор соосности носа и вектора скорости ---
  if (G.phase === 'fly') {
    let diff = rocket.rotation.z - Math.atan2(p.vel.y, p.vel.x);
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const deg = Math.abs(diff) * 180 / Math.PI;

    if      (deg <  8) { $alignText.textContent = '🎯 0°';   $alignText.style.color = '#7dffa0'; }
    else if (deg < 25) { $alignText.textContent = Math.round(deg) + '°'; $alignText.style.color = '#ffd75e'; }
    else               { $alignText.textContent = Math.round(deg) + '°'; $alignText.style.color = '#ff7a7a'; }

    // Цвет пламени: соосно = голубое, мимо = оранжевое
    if (boosting) {
      flameMat.color.setHex(deg < 15 ? 0x9fe8ff : 0xffb703);
    }
  }


  // Пламя
  const boostAmt = boosting ? 1 : (G.phase === 'fly' ? 0.35 : 0);
  const flick = 0.85 + Math.random() * 0.3;
  flame.scale.set(boostAmt * flick, boostAmt * flick, boostAmt * flick);
  flameInner.scale.set(boostAmt * flick * 1.1, boostAmt * flick, boostAmt * flick);
  flame.visible = boostAmt > 0.05;
  flameInner.visible = flame.visible;
  flameMat.opacity = boosting ? 0.95 : 0.5;
  exhaustLight.intensity = boostAmt * (boosting ? 45 : 8);
}

/* ---------- Camera ---------- */
const camLook = new THREE.Vector3(0, 3, 0);
let camBlend = 0;   // 0 = вид сбоку, 1 = вид сзади (плавный переход)

function updateCamera(dt) {
  const p = rocketState.pos;
  const gY = terrainHeight(p.x, 0);

  // Куда стремимся: сзади — только в полёте
  const wantBehind = (G.phase === 'fly') ? 1 : 0;
  const blendSpeed = wantBehind > camBlend ? 3.0 : 1.8;
  camBlend += (wantBehind - camBlend) * Math.min(1, dt * blendSpeed);
  if (camBlend < 0.001) camBlend = 0;
  if (camBlend > 0.999) camBlend = 1;

  // --- Угол возвышения камеры зависит от высоты над рельефом ---
  // 0 м → 20° (смотрим почти сбоку), 400 м → 80° (почти вид сверху)
  const alt   = Math.max(0, p.y - gY);
  const altT  = Math.min(1, alt / 400);
  const elev  = (20 + 60 * altT) * Math.PI / 180;

  // --- Камера на сфере радиуса R вокруг ракеты ---
  const R     = 22;
  const hDist = R * Math.cos(elev);   // горизонтальное смещение
  const vDist = R * Math.sin(elev);   // вертикальное смещение

  // Позиция камеры относительно ракеты:
  //   сбоку  (camBlend = 0): смещение по +Z
  //   сзади  (camBlend = 1): смещение по -X
  const camX = p.x - hDist * camBlend;
  const camY = p.y + vDist;
  const camZ = hDist * (1 - camBlend);

  // Плавное доведение
  const s = 1 - Math.exp(-7 * dt);
  camera.position.x += (camX - camera.position.x) * s;
  camera.position.y += (camY - camera.position.y) * s;
  camera.position.z += (camZ - camera.position.z) * s;

  // --- Точка обзора ---
  // На низкой высоте слегка заглядываем вперёд, на высокой — смотрим прямо на ракету
  const lookAhead = (5 + 10 * camBlend) * (1 - altT * 0.8);
  const lookX = p.x + lookAhead;
  const lookY = p.y;

  camLook.x += (lookX - camLook.x) * s;
  camLook.y += (lookY - camLook.y) * s;
  camLook.z += (0 - camLook.z) * s;

  // Тряска
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.2);
    const a = shake * shake * 0.5;
    camera.position.x += (Math.random() - .5) * a;
    camera.position.y += (Math.random() - .5) * a;
  }

  camera.lookAt(camLook);
}

/* ---------- Scenery recycling ---------- */
function updateScenery() {
  // Пропсы теперь статичные — рецикл не нужен.
  // Оставляем только переезд солнца, чтобы тени всегда были рядом с камерой.
  const camX = camera.position.x;
  sun.position.set(camX + 20, 65, 25);
  sun.target.position.set(camX, 0, 0);
  sun.target.updateMatrixWorld();
}

/* ================================================================
   12. MAIN LOOP
================================================================ */
let last = performance.now();

function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  update(dt);
  renderer.render(scene, camera);

  requestAnimationFrame(loop);
}

/* ================================================================
   13. INIT
================================================================ */
resetRocket();
rocket.position.copy(rocketState.pos);
G.fuel = maxFuel();
updateHUD();
renderShop();
requestAnimationFrame(loop);

// Приветствие
setTimeout(() => showToast('ПНИ РАКЕТУ! 🦵', '#ffd75e'), 400);
</script>
