}

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ================================================================
   0. SEEDED RNG — детерминированная генерация по seed
================================================================ */
const WORLD_SEED = 1337;   // ← поменяй, и весь мир будет другой

function hash2i(x, y) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return h >>> 0;
}
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Текущий генератор. Фабрики пропсов читают rnd().
let currentRng = Math.random;
const rnd = () => currentRng();

/* ================================================================
   1. RENDERER / SCENE / CAMERA
================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const SKY = 0x8ec9f2;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 55, 260);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(6, 8, 26);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================================================================
   2. LIGHTS
================================================================ */
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a7a35, 1.15));

const sun = new THREE.DirectionalLight(0xfff3d6, 2.0);
sun.position.set(20, 45, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45;
sc.near = 1; sc.far = 160;
sun.shadow.bias = -0.0008;
scene.add(sun);
scene.add(sun.target);



/* ================================================================
   3. TERRAIN — бесконечный, без границ
================================================================ */
const S = WORLD_SEED * 0.0001;   // смещение фаз от seed

function terrainBase(x, z) {
  let h = 0;

  // --- Полого-холмистая база (до 1000 м) ---
  h += Math.sin(x * 0.016 + 0.4 + S) * 5.5;
  h += Math.sin(x * 0.041 + 1.9 + S) * 2.4;
  h += Math.cos(z * 0.020 + 0.8 + S) * 3.0;
  h += Math.sin((x + z * 0.8) * 0.011 + 2.5 + S) * 4.0;
  h += Math.sin(x * 0.085 + 3.1 + S) * 0.9;
  h += Math.cos(z * 0.10 + 1.4 + S) * 0.7;
  const dip = Math.max(0, Math.sin(x * 0.0075 + 1.2 + S));
  h -= dip * dip * 5.5;

  // --- Горы после 1000 м (ridged noise, как было) ---
  const start_mountains = 1000;
  const mt  = Math.min(1, Math.max(0, (x - start_mountains) / 1800));
  const mt2 = mt * mt;

  const ridge = (u, v, freq, seed, sharp) => {
    const s = Math.sin(u * freq + v * freq * 0.55 + seed + S);
    return Math.pow(1 - Math.abs(s), sharp);
  };

  const r =
      ridge(x,  z, 0.00085, 0.4, 5.2) * 300   // главные пики  (период ~7400м)
    + ridge(x,  z, 0.0022,  1.1, 4.0) * 130   // средние       (период ~2850м)
    + ridge(x,  z, 0.0055,  2.9, 2.4) *  45   // мелкие скалы  (период ~1140м)
    + ridge(x,  z, 0.0135,  3.6, 1.3) *  15   // микрорельеф   (период ~465м)
    + ridge(z, -x, 0.0013, 5.2, 3.5) * 180   // поперечный хребет
    + ridge(z, -x, 0.0041, 6.8, 1.4) *  60;  // поперечный мелкий

  // Базовый подъём плато + сами хребты.
  // 80 — «пол» долин: горы стоят на плато высотой ~80 м.
  // 0.65 — общий масштаб, чтобы редкий пик достигал ~550 м.
  h += mt2 * (80 + r * 0.65);
  return h;
}

function terrainHeight(x, z) {
  const d = Math.hypot(x + 2.6, z);
  const flat = Math.min(1, Math.max(0, (d - 6) / 14));
  return terrainBase(x, z) * flat;
}

// --- Общая текстура земли (используется всеми чанками) ---
const TILE = 6;
function makeGroundTexture() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6cbf4a';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 420; i++) {
    ctx.fillStyle = Math.random() > .5 ? 'rgba(0,0,0,0.045)' : 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.arc(Math.random() * s, Math.random() * s, 3 + Math.random() * 16, 0, 6.284);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 1.5); ctx.lineTo(s, 1.5);
  ctx.moveTo(1.5, 0); ctx.lineTo(1.5, s);
  ctx.stroke();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const groundTex = makeGroundTexture();
const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, metalness: 0 });

/* ================================================================
   3b. CHUNK SYSTEM — 3D мир
================================================================ */
const CHUNK_SIZE        = 200; //Размер чанка в метрах. Один меш земли + его пропсы.
const CHUNK_SEG         = 40; //Сколько квадов на сторону чанка. Детализация рельефа.
const LOAD_RADIUS       = 400;
const UNLOAD_RADIUS     = 500;
const CHUNKS_PER_FRAME  = 2;
const COUNT = 500; //Плотность леса

const chunks     = new Map();   // "cx,cz" -> { mesh, props }
let   showing3D  = true;        // флаг для управления видимостью пропсов из updateLOD

function makeChunkMesh(cx, cz) {
  const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_SEG, CHUNK_SEG);
  geo.rotateX(-Math.PI / 2);

  const cxw = cx * CHUNK_SIZE + CHUNK_SIZE / 2;
  const czw = cz * CHUNK_SIZE + CHUNK_SIZE / 2;

  const pos = geo.attributes.position;
  const uv  = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const wx = cxw + pos.getX(i);
    const wz = czw + pos.getZ(i);
    pos.setY(i, terrainHeight(wx, wz));
    uv.setXY(i, wx / TILE, wz / TILE);
  }
  pos.needsUpdate = true;
  uv.needsUpdate  = true;
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, groundMat);
  mesh.position.set(cxw, 0, czw);
  mesh.receiveShadow = true;
  return mesh;
}

function spawnChunkProps(cx, cz) {
  // Детерминированный seed — тот же чанк всегда даёт тот же лес
  const seed = hash2i(cx + 0x9E37, cz + 0x79B9) ^ WORLD_SEED;
  const old  = currentRng;
  currentRng = mulberry32(seed);

  const arr   = [];
  const baseX = cx * CHUNK_SIZE;
  const baseZ = cz * CHUNK_SIZE;
  

  for (let i = 0; i < COUNT; i++) {
    const wx = baseX + rnd() * CHUNK_SIZE;
    const wz = baseZ + rnd() * CHUNK_SIZE;
    if (Math.hypot(wx + 2.6, wz) < 16) continue;

    const r = rnd();
    let m;
    if      (r < 0.45) m = makePine();
    else if (r < 0.60) m = makeOak();
    else if (r < 0.82) m = makeBush();
    else                m = makeRock();

    m.position.set(wx, terrainHeight(wx, wz), wz);
    scene.add(m);
    arr.push(m);
  }

  currentRng = old;
  return arr;
}

function loadChunk(cx, cz) {
  const key = cx + ',' + cz;
  if (chunks.has(key)) return;
  const mesh  = makeChunkMesh(cx, cz);
  const props = spawnChunkProps(cx, cz);
  scene.add(mesh);
  for (const p of props) p.visible = showing3D;
  chunks.set(key, { mesh, props });
}

function unloadChunk(key) {
  const c = chunks.get(key);
  if (!c) return;
  scene.remove(c.mesh);
  c.mesh.geometry.dispose();
  for (const p of c.props) scene.remove(p);
  chunks.delete(key);
}

function updateChunks(camX, camZ, initial = false) {
  const cxi = Math.floor(camX / CHUNK_SIZE);
  const czi = Math.floor(camZ / CHUNK_SIZE);
  const r   = Math.ceil(LOAD_RADIUS / CHUNK_SIZE);

  const toLoad = [];
  for (let dx = -r; dx <= r; dx++) {
    for (let dz = -r; dz <= r; dz++) {
      const cx = cxi + dx, cz = czi + dz;
      if (!chunks.has(cx + ',' + cz)) toLoad.push([cx, cz]);
    }
  }

  if (initial) {
    for (const [cx, cz] of toLoad) loadChunk(cx, cz);
  } else {
    const n = Math.min(CHUNKS_PER_FRAME, toLoad.length);
    for (let i = 0; i < n; i++) loadChunk(toLoad[i][0], toLoad[i][1]);
  }

  const ur = Math.ceil(UNLOAD_RADIUS / CHUNK_SIZE);
  const toUnload = [];
  for (const key of chunks.keys()) {
    const [cs, czs] = key.split(',');
    if (Math.abs(+cs - cxi) > ur || Math.abs(+czs - czi) > ur) toUnload.push(key);
  }
  for (const k of toUnload) unloadChunk(k);
}


/* ================================================================
   4. PROPS: деревья, кусты, камни
================================================================ */

const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x7a4a24, roughness: .95 });
const treeLeafMats = [
  new THREE.MeshStandardMaterial({ color: 0x2f7d32, roughness: .9 }),
  new THREE.MeshStandardMaterial({ color: 0x3f9440, roughness: .9 }),
  new THREE.MeshStandardMaterial({ color: 0x256b2a, roughness: .9 }),
];
const rockMatA = new THREE.MeshStandardMaterial({ color: 0x8a8479, roughness: 1, flatShading: true });
const rockMatB = new THREE.MeshStandardMaterial({ color: 0x6e6a63, roughness: 1, flatShading: true });
const rockGeo  = new THREE.IcosahedronGeometry(1, 0);

function makePine() {
  const g = new THREE.Group();
  const h = 2 + rnd() * 3;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18, .26, h, 6), treeTrunkMat);
  trunk.position.y = h / 2; trunk.castShadow = true; g.add(trunk);
  const leafMat = treeLeafMats[(rnd() * 3) | 0];
  const layers = 2 + ((rnd() * 2) | 0);
  for (let i = 0; i < layers; i++) {
    const r = (1.5 - i * 0.35) * (0.8 + rnd() * 0.4);
    const lh = 1.7 - i * 0.15;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, lh, 7), leafMat);
    cone.position.y = h + i * (lh * 0.5) + lh * 0.3;
    cone.castShadow = true; g.add(cone);
  }
  g.scale.setScalar(0.75 + rnd() * 0.8);
  return g;
}

function makeOak() {
  const g = new THREE.Group();
  const th = 1.8 + rnd() * 1.2;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.22, .34, th, 6), treeTrunkMat);
  trunk.position.y = th / 2; trunk.castShadow = true; g.add(trunk);
  const mat = treeLeafMats[(rnd() * 3) | 0];
  const blobs = 3 + ((rnd() * 3) | 0);
  for (let i = 0; i < blobs; i++) {
    const r = 0.85 + rnd() * 0.7;
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), mat);
    s.position.set((rnd() - .5) * 1.4, th + 0.6 + rnd() * 1.1, (rnd() - .5) * 1.4);
    s.castShadow = true; g.add(s);
  }
  g.scale.setScalar(0.85 + rnd() * 0.6);
  return g;
}

function makeBush() {
  const g = new THREE.Group();
  const mat = treeLeafMats[(rnd() * 3) | 0];
  const blobs = 2 + ((rnd() * 2) | 0);
  for (let i = 0; i < blobs; i++) {
    const r = 0.5 + rnd() * 0.4;
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5), mat);
    s.position.set((rnd() - .5) * 0.9, r * 0.8, (rnd() - .5) * 0.9);
    s.castShadow = true; g.add(s);
  }
  g.scale.setScalar(0.8 + rnd() * 0.7);
  return g;
}

function makeRock() {
  const g = new THREE.Group();
  const mat = rnd() > 0.5 ? rockMatA : rockMatB;
  const m = new THREE.Mesh(rockGeo, mat);
  m.scale.set(1, 0.7 + rnd() * 0.5, 1);
  m.rotation.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28);
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  if (rnd() > 0.5) {
    const m2 = new THREE.Mesh(rockGeo, mat);
    m2.scale.setScalar(0.4 + rnd() * 0.4);
    m2.position.set(0.9 + rnd() * 0.6, 0, 0.3);
    m2.rotation.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28);
    m2.castShadow = true; g.add(m2);
  }
  g.scale.setScalar(0.6 + rnd() * 1.4);
  return g;
}



/* ================================================================
   5. BOSS (босс из коробок)
================================================================ */
const boss = new THREE.Group();
boss.position.set(-2.6, 0, 0);

const skinMat   = new THREE.MeshStandardMaterial({ color: 0xd94f6b, roughness: .55 });
const darkMat   = new THREE.MeshStandardMaterial({ color: 0x2b2233, roughness: .8 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0xffd75e, roughness: .4, metalness: .3 });

function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// Торс
const torso = box(2.0, 2.4, 1.4, skinMat);
torso.position.y = 3.8;
boss.add(torso);

// Грудь-акцент
const chest = box(1.1, 0.9, 0.15, accentMat);
chest.position.set(0, 4.0, 0.75);
boss.add(chest);

// Голова
const head = box(1.25, 1.2, 1.2, skinMat);
head.position.y = 5.7;
boss.add(head);

// Глаза
for (const zz of [0.62, -0.62]) {
  const eye = box(0.3, 0.22, 0.1, darkMat);
  eye.position.set(0.3, 5.85, zz);
  eye.rotation.y = 0;
  boss.add(eye);
}
// Брови (злые)
const brow = box(0.36, 0.1, 0.12, darkMat);
brow.position.set(0.32, 6.05, 0.62); brow.rotation.z = -0.35; boss.add(brow);
const brow2 = brow.clone(); brow2.position.z = -0.62; brow2.rotation.z = 0.35; boss.add(brow2);

// Руки
const armL = box(0.55, 2.1, 0.55, skinMat);
armL.position.set(0, 3.6, 1.05);
armL.geometry.translate(0, -1.05, 0);
armL.position.y = 4.7;
boss.add(armL);

const armR = box(0.55, 2.1, 0.55, skinMat);
armR.geometry.translate(0, -1.05, 0);
armR.position.set(0, 4.7, -1.05);
boss.add(armR);

// Ноги — пивот в бедре
function makeLeg() {
  const pivot = new THREE.Group();
  const upper = box(0.72, 1.4, 0.72, darkMat);
  upper.position.y = -0.7;
  pivot.add(upper);

/* ================================================================
   5b. VEG OVERLAY CHUNKS — 2D-точки, размер 1600×1600
================================================================ */
const OVERLAY_SIZE     = 1600;
// = OVERLAY_SIZE / (CHUNK_SIZE / CHUNK_SEG) — совпадает с разрешением земли,
// иначе overlay «проваливается» под рельеф на пиках, и туман рисуется пятнами.
const OVERLAY_SEG      = 80;
const OVERLAY_CANVAS   = 1024;   // 1.6 м/пиксель — точки чётче, без «каши»
const OVERLAY_LOAD_R   = 2;
const OVERLAY_UNLOAD_R = 3;
const OVERLAY_PER_FRAME= 1;

const overlayChunks = new Map(); // "ox,oz" -> { mesh, mat, tex, geo }

function makeOverlayGeometry(ox, oz) {
  const geo = new THREE.PlaneGeometry(OVERLAY_SIZE, OVERLAY_SIZE, OVERLAY_SEG, OVERLAY_SEG);
  geo.rotateX(-Math.PI / 2);

  const cxw = ox * OVERLAY_SIZE + OVERLAY_SIZE / 2;
  const czw = oz * OVERLAY_SIZE + OVERLAY_SIZE / 2;

  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const wx = cxw + pos.getX(i);
    const wz = czw + pos.getZ(i);
    pos.setY(i, terrainHeight(wx, wz));
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

function makeOverlayCanvas(ox, oz) {
  const W = OVERLAY_CANVAS, H = OVERLAY_CANVAS;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const baseX = ox * OVERLAY_SIZE;
  const baseZ = oz * OVERLAY_SIZE;

  // Свой seed — не совпадает с 3D-чанками
  const seed = hash2i(ox + 0x51ED, oz + 0x270F) ^ WORLD_SEED;
  const rng  = mulberry32(seed);

  const N = 2200;
  for (let i = 0; i < N; i++) {
    const wx = baseX + rng() * OVERLAY_SIZE;
    const wz = baseZ + rng() * OVERLAY_SIZE;
    if (Math.hypot(wx + 2.6, wz) < 16) continue;

    const px = (wx - baseX) / OVERLAY_SIZE * W;
    const py = (wz - baseZ) / OVERLAY_SIZE * H;

    const isRock = rng() < 0.18;
    if (isRock) {
      ctx.fillStyle = 'rgba(110, 102, 90, 0.7)';
      ctx.fillRect(px, py, 1, 1);
    } else {
      const isBig = rng() < 0.35;
      ctx.fillStyle = isBig
        ? 'rgba(18, 55, 16, 0.9)'
        : 'rgba(28, 75, 22, 0.75)';
      ctx.fillRect(px, py, 1, 1);
      if (isBig) ctx.fillRect(px + 1, py, 1, 1);
    }
  }

  const tex = new THREE.CanvasTexture(canvas);
  // NearestFilter: точки — пиксельные, без размазанных линейной интерполяцией
  // зелёно-чёрных «ореолов», которые путают восприятие тумана.
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function loadOverlayChunk(ox, oz) {
  const key = ox + ',' + oz;
  if (overlayChunks.has(key)) return;

  const geo  = makeOverlayGeometry(ox, oz);
  const tex  = makeOverlayCanvas(ox, oz);
  const mat  = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    depthWrite: false,
    polygonOffset: true,
    polygonOffsetFactor: -4,
    polygonOffsetUnits: -4,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(ox * OVERLAY_SIZE + OVERLAY_SIZE / 2, 0, oz * OVERLAY_SIZE + OVERLAY_SIZE / 2);
  mesh.renderOrder = 2;
  mesh.material.opacity = lodFade;
  mesh.visible = lodFade > 0.005;
  scene.add(mesh);

  overlayChunks.set(key, { mesh, mat, tex, geo });
}

function unloadOverlayChunk(key) {
  const c = overlayChunks.get(key);
  if (!c) return;
  scene.remove(c.mesh);
  c.geo.dispose();
  c.tex.dispose();
  c.mat.dispose();
  overlayChunks.delete(key);
}

function updateOverlayChunks(camX, camZ, initial = false) {
  const oxi = Math.floor(camX / OVERLAY_SIZE);
  const ozi = Math.floor(camZ / OVERLAY_SIZE);

  const toLoad = [];
  for (let dx = -OVERLAY_LOAD_R; dx <= OVERLAY_LOAD_R; dx++) {
    for (let dz = -OVERLAY_LOAD_R; dz <= OVERLAY_LOAD_R; dz++) {
      const ox = oxi + dx, oz = ozi + dz;
      if (!overlayChunks.has(ox + ',' + oz)) toLoad.push([ox, oz]);
    }
  }

  if (initial) {
    for (const [ox, oz] of toLoad) loadOverlayChunk(ox, oz);
  } else {
    const n = Math.min(OVERLAY_PER_FRAME, toLoad.length);
    for (let i = 0; i < n; i++) loadOverlayChunk(toLoad[i][0], toLoad[i][1]);
  }

  const toUnload = [];
  for (const key of overlayChunks.keys()) {
    const [oxs, ozs] = key.split(',');
    if (Math.abs(+oxs - oxi) > OVERLAY_UNLOAD_R ||
        Math.abs(+ozs - ozi) > OVERLAY_UNLOAD_R) toUnload.push(key);
  }
  for (const k of toUnload) unloadOverlayChunk(k);
}

const ANG_DAMP = 0.8;    // 1/с   — вязкое затухание (чем больше — тем «гуще»)
const ANG_MAX  = 18.0;    // рад/с — предохранитель от разгона

  { key: 'aero',   icon: '🪶', name: 'Аэродинамика',   desc: 'Меньше торможения',  base: 45, growth: 1.60 },

];

// Сила пинка — стартовая скорость в м/с

// Тяга — чистое ускорение в м/с² вдоль носа ракеты
const thrustAcc= () => 12 + (G.upgrades.thrust - 1) * 4;    // Lv1: 12, Lv10: 48 м/с²

// Сопротивление воздуха: a_drag = k · v²  (квадратичное, как в аэродинамике)
const dragCoef = () => 0.0025 / (1 + (G.upgrades.aero - 1) * 0.40);  // 1/м

const airDensity = (y) => Math.exp(-Math.max(0, y) / 20000);

/* ================================================================
   10. GAME LOGIC
================================================================ */
function startKick() {
  if (G.phase !== 'ready' && G.phase !== 'landed') return;
  resetRocket();
  G.phase = 'windup';
  G.timer = 0;
    $launch.classList.add('hidden');
  $shop.style.display = 'none';
}

function resetRocket() {
  const gY = terrainHeight(0, 0);
  rocketState.pos.set(0, gY + REST_Y, 0);
  rocketState.vel.set(0, 0, 0);
  rocket.rotation.z = 0;
  rocketState.angVel = 0;
  rocket.position.copy(rocketState.pos);
  G.fuel = maxFuel();
  input.boost = false;
}

function launch() {
  const speed = launchSpeed();
  rocketState.vel.set(
    Math.cos(LAUNCH_ANGLE) * speed,
    Math.sin(LAUNCH_ANGLE) * speed,
    0
  );
  // Мгновенно ставим ракету под угол старта — она «вылетает из-под ноги» как надо
  rocket.rotation.z = LAUNCH_ANGLE;
  rocketState.angVel = 0;
  G.phase = 'fly';
  G.timer = 0;
  boosting = false;
  showToast('ПОЛЕТЕЛИ! 🚀', '#ffd75e');
}

function land() {
  G.phase = 'landed';
  G.timer = 0;
  rocketState.angVel = 0;
  const gY = terrainHeight(rocketState.pos.x, rocketState.pos.z);
  rocketState.pos.y = gY + REST_Y;
  rocketState.vel.set(0, 0, 0);

  const dist   = Math.max(0, rocketState.pos.x);
  const earned = Math.max(1, Math.floor(dist));
  G.lastDist = dist;
  G.coins += earned;
  if (dist > G.best) G.best = dist;

  updateHUD();
  renderShop();

  $launch.classList.remove('hidden');
  $shop.style.display = '';
  $launch.textContent = 'Пнуть снова! 🦵';

  showToast(`${Math.floor(dist)} м  +${earned} 💥`, '#7dffa0');

  // Тряска камеры
  shake = 0.9;
}

/* ---------- Boss ---------- */
function updateBoss(dt) {
  const idle = performance.now() * 0.0022;

  if (G.phase === 'ready' || G.phase === 'landed') {
    legKick.rotation.z += (0 - legKick.rotation.z) * Math.min(1, dt * 12);
    boss.position.y = Math.sin(idle) * 0.08;
    torso.rotation.z = Math.sin(idle * 0.7) * 0.03;
    head.rotation.z  = Math.sin(idle * 0.7) * 0.05;
    legBack.rotation.z = Math.sin(idle) * 0.03;
  }
  else if (G.phase === 'windup') {
    G.timer += dt;
    const t = Math.min(1, G.timer / 0.30);
    const e = 1 - Math.pow(1 - t, 3);
    legKick.rotation.z = -0.85 * e;
    torso.rotation.z = 0.12 * e;
    boss.position.y = -0.12 * e;

     if (t >= 1) {
      G.phase = 'strike';
      G.timer = 0;
    }
  }
  else if (G.phase === 'strike') {
    G.timer += dt;
    const t = Math.min(1, G.timer / 0.11);
    const e = t * t * (3 - 2 * t);
    legKick.rotation.z = -0.85 + (2.05 + 0.85) * e;
    torso.rotation.z = 0.12 - 0.28 * e;
    boss.position.y = -0.12 + 0.20 * e;

    if (t >= 1 && G.phase === 'strike') launch();
  }
  else if (G.phase === 'fly') {
    legKick.rotation.z += (0 - legKick.rotation.z) * Math.min(1, dt * 6);
    torso.rotation.z += (0 - torso.rotation.z) * Math.min(1, dt * 6);
    boss.position.y += (0 - boss.position.y) * Math.min(1, dt * 6);
  }
}

/* ---------- Rocket ---------- */
function updateRocket(dt) {
  const p = rocketState;
  const restY = terrainHeight(p.pos.x, p.pos.z) + REST_Y;

  if (G.phase === 'fly') {
    // --- Тяга: вектор вдоль носа ракеты (а не всегда вправо!) ---
    boosting = input.boost && G.fuel > 0;
    if (boosting) {
      const ta  = thrustAcc();
      const ang = rocket.rotation.z;
      p.vel.x += Math.cos(ang) * ta * dt;
      p.vel.y += Math.sin(ang) * ta * dt;
      G.fuel = Math.max(0, G.fuel - dt);   // 1 секунда буста = 1 секунда топлива
    }

    // --- Гравитация ---
    p.vel.y -= GRAVITY * dt;

    // --- Сопротивление воздуха: a = k·ρ(y)·v² , действует против вектора скорости ---
    const speed = p.vel.length();
    if (speed > 0.01) {
      const k = dragCoef() * airDensity(p.pos.y);
      const aDrag = k * speed;             // 1/с (умножится на v ещё раз ниже)
      p.vel.x -= p.vel.x * aDrag * dt;
      p.vel.y -= p.vel.y * aDrag * dt;
    }

    // --- Интеграция ---
    p.pos.addScaledVector(p.vel, dt);

    if (p.pos.y <= restY && p.vel.y < 0) {
      p.pos.y = restY;
      land();
    }  
  } else if (G.phase === 'landed') {
    p.pos.y += (restY - p.pos.y) * Math.min(1, dt * 8);
    rocket.rotation.z += (0 - rocket.rotation.z) * Math.min(1, dt * 6);
  }

  rocket.position.copy(p.pos);

  // --- Угловая динамика: игрок управляет носом, вязкое затухание ---
  if (G.phase === 'fly') {
    const rotInput =
      ((keys.W || touchKeys.W) ? 1 : 0) -
      ((keys.S || touchKeys.S) ? 1 : 0);

    p.angVel += rotInput * ANG_ACC * dt;
    p.angVel -= p.angVel * ANG_DAMP * dt;              // вязкое трение
    p.angVel = Math.max(-ANG_MAX, Math.min(ANG_MAX, p.angVel));

    rocket.rotation.z += p.angVel * dt;
  }

  // --- Индикатор соосности носа и вектора скорости ---
  if (G.phase === 'fly') {
    let diff = rocket.rotation.z - Math.atan2(p.vel.y, p.vel.x);
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const deg = Math.abs(diff) * 180 / Math.PI;

    if      (deg <  8) { $alignText.textContent = '🎯 0°';   $alignText.style.color = '#7dffa0'; }
    else if (deg < 25) { $alignText.textContent = Math.round(deg) + '°'; $alignText.style.color = '#ffd75e'; }
    else               { $alignText.textContent = Math.round(deg) + '°'; $alignText.style.color = '#ff7a7a'; }

    // Цвет пламени: соосно = голубое, мимо = оранжевое
    if (boosting) {
      flameMat.color.setHex(deg < 15 ? 0x9fe8ff : 0xffb703);
    }
  }


  // Пламя
  const boostAmt = boosting ? 1 : (G.phase === 'fly' ? 0.35 : 0);
  const flick = 0.85 + Math.random() * 0.3;
  flame.scale.set(boostAmt * flick, boostAmt * flick, boostAmt * flick);
  flameInner.scale.set(boostAmt * flick * 1.1, boostAmt * flick, boostAmt * flick);
  flame.visible = boostAmt > 0.05;
  flameInner.visible = flame.visible;
  flameMat.opacity = boosting ? 0.95 : 0.5;
  exhaustLight.intensity = boostAmt * (boosting ? 45 : 8);
}

/* ---------- Camera ---------- */
const camLook = new THREE.Vector3(0, 3, 0);
let camBlend = 0;   // 0 = вид сбоку, 1 = вид сзади (плавный переход)

function updateCamera(dt) {
  const p = rocketState.pos;
  const gY = terrainHeight(p.x, 0);
  const speed = rocketState.vel.length();

  // Куда стремимся: сзади — только в полёте
  const wantBehind = (G.phase === 'fly') ? 1 : 0;
  const blendSpeed = wantBehind > camBlend ? 3.0 : 1.8;
  camBlend += (wantBehind - camBlend) * Math.min(1, dt * blendSpeed);
  if (camBlend < 0.001) camBlend = 0;
  if (camBlend > 0.999) camBlend = 1;

  // --- Угол возвышения камеры зависит от высоты над рельефом ---

  const MAX_VIEW_HEIGHT = 1000
  const BASE_VIEW_HEIGHT_ANGLE = 20
  const MAX_VIEW_HEIGHT_ANGLE = 60 - BASE_VIEW_HEIGHT_ANGLE


  const alt   = Math.max(0, p.y - gY);
  const altT  = Math.min(1, alt / MAX_VIEW_HEIGHT);
  const elev  = (BASE_VIEW_HEIGHT_ANGLE + MAX_VIEW_HEIGHT_ANGLE * altT) * Math.PI / 180;

  // --- Камера на сфере радиуса R вокруг ракеты ---
  // На высокой скорости чуть отъезжаем — ракета не «упирается» в верх экрана
  const R     = 22 + Math.min(20, speed * 0.12);
  const hDist = R * Math.cos(elev);
  const vDist = R * Math.sin(elev);

  // --- Feed-forward: целимся туда, где ракета будет через 0.1 с ---
  // Компенсирует инерцию сглаживания при разгоне.
  const lead = -0.02;
  const px = p.x + rocketState.vel.x * lead;
  const py = p.y + rocketState.vel.y * lead;

  const camX = px - hDist * camBlend;
  const camY = py + vDist;
  const camZ = hDist * (1 - camBlend);

  // --- Адаптивная жёсткость: чем быстрее ракета, тем цепче камера ---
  const follow = 7 + Math.min(18, speed * 0.15);
  const s = 1 - Math.exp(-follow * dt);

  camera.position.x += (camX - camera.position.x) * s;
  camera.position.y += (camY - camera.position.y) * s;
  camera.position.z += (camZ - camera.position.z) * s;

  // --- Точка обзора (тоже с feed-forward) ---
  const lookAhead = (5 + 10 * camBlend) * (1 - altT * 0.8);
  const lookX = px + lookAhead;
  const lookY = py;

  camLook.x += (lookX - camLook.x) * s;
  camLook.y += (lookY - camLook.y) * s;
  camLook.z += (0 - camLook.z) * s;

  // Тряска
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.2);
    const a = shake * shake * 0.5;
    camera.position.x += (Math.random() - .5) * a;
    camera.position.y += (Math.random() - .5) * a;
  }

  camera.lookAt(camLook);
}

/* ---------- Scenery recycling ---------- */
function updateScenery() {
  // Пропсы теперь статичные — рецикл не нужен.
  // Оставляем только переезд солнца, чтобы тени всегда были рядом с камерой.
  const camX = camera.position.x;
  sun.position.set(camX + 20, 65, 25);
  sun.target.position.set(camX, 0, 0);
  sun.target.updateMatrixWorld();
}

/* ---------- LOD: 3D-пропсы ↔ 2D-точки деревьев с плавным переходом ---------- */
function updateLOD(dt) {
  //Высота смены отображения
  const CHANGE_OVERLAY = 400


  const p = rocketState.pos;
  const gY = terrainHeight(p.x, p.z);
  const alt = p.y - gY;
  const flying = (G.phase === 'fly');

  if (!in2DMode) {
    if (flying && alt > CHANGE_OVERLAY) in2DMode = true;
  } else {
    if (!flying || alt < CHANGE_OVERLAY - 50) in2DMode = false;
  }

  const targetFade = in2DMode ? 1 : 0;
  const speed      = in2DMode ? 1.4 : 2.0;
  lodFade += (targetFade - lodFade) * Math.min(1, dt * speed);
  if (lodFade < 0.005) lodFade = 0;
  if (lodFade > 0.995) lodFade = 1;

  // Все overlay-чанки — общая прозрачность
  for (const c of overlayChunks.values()) {
    c.mat.opacity = lodFade;
    c.mesh.visible = lodFade > 0.005;
  }

  // 3D-пропсы прячем только когда overlay уже почти погас (или наоборот)
  const want3D = lodFade < 0.15;
  if (want3D !== showing3D) {
    for (const c of chunks.values()) {
      for (const pr of c.props) pr.visible = want3D;
    }
    boss.visible = want3D;
    showing3D = want3D;
  }

  scene.fog.near = FOG_3D_NEAR + (FOG_2D_NEAR - FOG_3D_NEAR) * lodFade;
  scene.fog.far  = FOG_3D_FAR  + (FOG_2D_FAR  - FOG_3D_FAR ) * lodFade;
}



/* ================================================================
   12. MAIN LOOP
================================================================ */
let last = performance.now();

function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  update(dt);
  renderer.render(scene, camera);

  requestAnimationFrame(loop);
}

/* ================================================================
   13. INIT
================================================================ */
resetRocket();
rocket.position.copy(rocketState.pos);
G.fuel = maxFuel();
updateHUD();
renderShop();

// Первичная прогрузка — без неё первый кадр будет пустым
updateChunks(camera.position.x, camera.position.z, true);
updateOverlayChunks(camera.position.x, camera.position.z, true);


requestAnimationFrame(loop);

// Приветствие
setTimeout(() => showToast('ПНИ РАКЕТУ! 🦵', '#ffd75e'), 400);
</script>
