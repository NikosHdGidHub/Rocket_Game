<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>🚀 Ракетный Пинок 3D</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <button id="settingsBtn" class="settings-btn" title="Настройки">⚙️</button>
    <div id="hud">
      <div class="stat">📏 <b id="dist">0</b> м</div>
      <div class="stat">💥 <b id="coins">0</b></div>
      <div class="stat">🏆 <b id="best">0</b> м</div>
      <button id="resetBtn" class="reset-btn" title="Сбросить прогресс">🗑️</button>
    </div>
    <div id="chestProgress" class="chest-progress">
      <div class="chest-icon">📦</div>
      <div class="chest-track">
        <div class="chest-fill" id="chestFill"></div>
      </div>
      <div class="chest-dist" id="chestDist">—</div>
    </div>

    <div id="boostUI">
      <div id="fuelTrack"><div id="fuelFill"></div></div>
      <div id="boostHint">🔥 <span id="fuelText">0.0</span> с · <span id="alignText">—</span></div>
    </div>

    <div id="touchControls" class="hidden">
      <div id="rotBtns">
        <button id="rotUp" class="tbtn" aria-label="Поворот вверх">▲</button>
        <button id="rotDown" class="tbtn" aria-label="Поворот вниз">▼</button>
      </div>
      <button id="pushBtn" class="push-btn" aria-label="Тяга">
        <span class="push-icon">🔥</span>
        <span class="push-text">PUSH</span>
      </button>
    </div>

    <div id="helpText">
      <span class="key">W</span><span class="key">S</span> — ПОВОРОТ ·
      <span class="key">ПРОБЕЛ</span> — ТЯГА
    </div>

    <div id="panel">
      <div id="shop"></div>
      <button id="launch">Пнуть! 🦵</button>
    </div>

    <div id="loading">
      <div class="loading-title">🚀 ЗАГРУЗКА</div>
      <div class="loading-bar-wrap">
        <div id="loadingBar"></div>
      </div>
      <div class="loading-text" id="loadingText">Загрузка мира…</div>
    </div>

    <div id="cardPopup">
      <div class="card">
        <div class="card-glow"></div>
        <div class="card-label">РЕДКАЯ НАХОДКА</div>
        <div class="card-icon" id="cardIcon">⛽</div>
        <div class="card-name" id="cardName">Двойной бак</div>
        <div class="card-desc" id="cardDesc">Топливо ×2</div>
        <div class="card-hint">тап — закрыть</div>
      </div>
    </div>
    <div id="settingsPanel" class="settings-panel">
      <div class="settings-card">
        <div class="settings-title">⚙️ НАСТРОЙКИ</div>
        <label class="settings-row">
          <input type="checkbox" id="lowSpecToggle" />
          <span>Режим слабого устройства</span>
        </label>
        <div class="settings-hint">
          Уменьшает количество растительности ×2.<br />
          Игра перезагрузится автоматически.
        </div>
        <button id="settingsClose" class="settings-close">Закрыть</button>
      </div>
    </div>

    <div id="toast"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
