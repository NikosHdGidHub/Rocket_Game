# Простой рабочий процесс для деплоя статического контента на GitHub Pages
name: Deploy static content to Pages

on:
  # Запускать при пуше в ветку main
  push:
    branches: ['main']

  # Позволяет запускать этот рабочий процесс вручную из вкладки Actions
  workflow_dispatch:

# Устанавливаем разрешения GITHUB_TOKEN для разрешения деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один одновременный деплой
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite по умолчанию собирает проект в папку dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
