<title>🚀 Rocket Game — Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

  .tab:hover { border-color: #ffd75e; color: #ffd75e; }

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as CFG from '../scripts/config.js'
import { terrainHeight } from '../scripts/world/world.js'

/* ================================================================
   ХЕЛПЕРЫ — суммы апгрейдов
================================================================ */
const fmtSpent = (n) => Math.floor(n).toLocaleString('ru-RU')
const fmtCost  = (c) => c >= 1000 ? Math.round(c / 1000) + 'k' : String(c)
const fmtM = (m) => {
  if (m < 1000) return Math.round(m) + ' м'
  if (m < 10000) return (m / 1000).toFixed(2) + ' км'
  return Math.round(m / 1000) + ' км'
}

/** Сколько всего потрачено на апгрейд, чтобы дойти до уровня `level`. */
function totalSpent(u, level) {
  let total = 0
  for (let L = 1; L < level; L++) {
    total += CFG.RULES.upgradeCost(u, L)
  }
  return total
}

function updateUpgradesTotal(prefix) {
  const $el = document.getElementById(`${prefix}upgrades-total`)
  if (!$el) return
  let sum = 0
  for (const u of CFG.UPGRADES) {
    const inp = document.getElementById(`${prefix}${u.key}`)
    if (!inp) continue
    sum += totalSpent(u, +inp.value)
  }
  $el.textContent = sum > 0 ? fmtSpent(sum) + ' 💰' : '—'
}

/* ================================================================
   SIMULATION — физика game.js → updateRocket() + траектория.
================================================================ */
function simulate(upgrades, cards, opts = {}) {
  const {
    boostThrottle = 'always',
    forsageLevel = 0,
    noseLiftEnabled = false,
    noseLiftAngle = 45,
    dt = 1 / 60,
    maxTime = 3600,
  } = opts

  const cardMul = (key) => {
    const n = cards[key] || 0
    if (n === 0) return 1
    const card = CFG.CARDS.find((c) => c.key === key)
    return card && typeof card.buff === 'number' ? Math.pow(card.buff, n) : 1
  }

  const launchSpeed     = CFG.RULES.launchSpeed(upgrades) * cardMul('power2x')
  const maxFuelVal      = CFG.RULES.maxFuel(upgrades)     * cardMul('fuel2x')
  const thrustAccBase   = CFG.RULES.thrustAcc(upgrades)   * cardMul('thrust2x')
  const gravityEff      = CFG.GAME.gravity                * cardMul('airtime')
  const dragMul         = cardMul('aero2x')
  const dragCoefAtAngle = (alpha) =>
    CFG.RULES.dragCoefAtAngle(upgrades, alpha) * dragMul

  let forsageMult = 1
  let forsageDurationLeft = 0
  if (forsageLevel > 0) {
    const idx = Math.min(forsageLevel, CFG.ABILITIES.forsage.levels.length) - 1
    const lv = CFG.ABILITIES.forsage.levels[idx]
    forsageMult = lv.multiplier
    forsageDurationLeft = lv.duration
  }

  const ANG_ACC   = CFG.GAME.angAcc
  const ANG_DAMP  = CFG.GAME.angDamp
  const ANG_MAX   = CFG.GAME.angMax
  const ALIGN     = CFG.GAME.aeroAlign
  const MIN_SPEED = CFG.GAME.aeroAlignMinSpeed
  const LAUNCH_ANGLE = CFG.GAME.launchAngle
  const yaw       = CFG.GAME.flightYaw || 0
  const REST_Y    = CFG.GAME.restY

  const PD_KP = 6.0
  const PD_KD = 2.5
  const PD_VEL_MAX = 5.0
  const noseTargetRad = noseLiftEnabled ? (noseLiftAngle * Math.PI) / 180 : null

  const horiz = Math.cos(LAUNCH_ANGLE) * launchSpeed
  let vx = Math.cos(yaw) * horiz
  let vy = Math.sin(LAUNCH_ANGLE) * launchSpeed
  let vz = Math.sin(yaw) * horiz
  let x = 0, y = REST_Y, z = 0
  let angZ = LAUNCH_ANGLE
  let angVel = 0
  let fuel = maxFuelVal
  let t = 0
  let maxAlt = 0
  let maxSpeed = launchSpeed
  let boostEndAngle = null
  let maxTimeReached = false

  const trajectory = [[0, REST_Y]]
  let nextSampleT = 0.1
  const SAMPLE_INTERVAL = 0.1

  const maxSteps = Math.ceil(maxTime / dt)

  for (let step = 0; step < maxSteps; step++) {
    const terrainY = terrainHeight(x, z)
    const restY = terrainY + REST_Y

    const forsageActive = forsageDurationLeft > 0
    const boosting = boostThrottle === 'always' && !forsageActive && fuel > 0
    const thrustActive = boosting || forsageActive

    if (boostEndAngle === null && !thrustActive && t > 0.01) {
      boostEndAngle = (angZ * 180) / Math.PI
    }

    let appliedThrust = 0
    if (boosting) {
      appliedThrust += thrustAccBase
      fuel = Math.max(0, fuel - dt)
    }
    if (forsageActive) {
      appliedThrust += thrustAccBase * forsageMult
      forsageDurationLeft -= dt
    }

    if (appliedThrust > 0) {
      const c = Math.cos(angZ)
      vx += c * Math.cos(yaw) * appliedThrust * dt
      vy += Math.sin(angZ) * appliedThrust * dt
      vz += c * Math.sin(yaw) * appliedThrust * dt
    }

    vy -= gravityEff * dt

    const speed = Math.sqrt(vx * vx + vy * vy + vz * vz)
    if (speed > 0.01) {
      const noseX = Math.cos(angZ) * Math.cos(yaw)
      const noseY = Math.sin(angZ)
      const noseZ = Math.cos(angZ) * Math.sin(yaw)
      const dot = (noseX * vx + noseY * vy + noseZ * vz) / speed
      const alpha = Math.acos(Math.max(-1, Math.min(1, dot)))
      const k = dragCoefAtAngle(alpha) * CFG.RULES.airDensity(y)
      const aDrag = k * speed
      vx -= vx * aDrag * dt
      vy -= vy * aDrag * dt
      vz -= vz * aDrag * dt
    }

    x += vx * dt
    y += vy * dt
    z += vz * dt

    if (y <= restY && vy < 0) {
      y = restY
      t += dt
      trajectory.push([x, y])
      break
    }

    let rotInput = 0
    if (thrustActive && noseTargetRad !== null) {
      const error = noseTargetRad - angZ
      const desiredVel = Math.max(-PD_VEL_MAX, Math.min(PD_VEL_MAX, error * PD_KP))
      const rawInput = ((desiredVel - angVel) * PD_KD) / ANG_ACC
      rotInput = Math.max(-1, Math.min(1, rawInput))
    }

    angVel += rotInput * ANG_ACC * dt
    angVel -= angVel * ANG_DAMP * dt
    angVel = Math.max(-ANG_MAX, Math.min(ANG_MAX, angVel))
    angZ += angVel * dt

    const spd = Math.sqrt(vx * vx + vy * vy + vz * vz)
    if (ALIGN > 0 && spd > MIN_SPEED) {
      const desired = Math.atan2(vy, Math.hypot(vx, vz))
      let diff = desired - angZ
      while (diff > Math.PI) diff -= Math.PI * 2
      while (diff < -Math.PI) diff += Math.PI * 2
      const maxStep = ALIGN * dt
      const applied = Math.sign(diff) * Math.min(Math.abs(diff), maxStep)
      angZ += applied
    }

    t += dt
    const altNow = y - terrainY
    if (altNow > maxAlt) maxAlt = altNow
    if (spd > maxSpeed) maxSpeed = spd

    if (t >= nextSampleT) {
      trajectory.push([x, y])
      nextSampleT += SAMPLE_INTERVAL
    }

    if (step === maxSteps - 1) maxTimeReached = true
  }

  return {
    distance: Math.max(0, x),
    maxAltitude: maxAlt,
    time: t,
    maxSpeed,
    fuelUsed: maxFuelVal - fuel,
    landingTerrain: terrainHeight(x, z),
    boostEndAngle,
    trajectory: downsampleTrajectory(trajectory, 2000),
    maxTimeReached,
  }
}

/** Не даём SVG получить 20 000 точек — режем до ~2000, сохраняя форму. */
function downsampleTrajectory(traj, maxPts) {
  if (traj.length <= maxPts) return traj
  const out = [traj[0]]
  const step = (traj.length - 1) / (maxPts - 1)
  for (let i = 1; i < maxPts - 1; i++) {
    out.push(traj[Math.round(i * step)])
  }
  out.push(traj[traj.length - 1])
  return out
}

/**
 * Трёхуровневый расчёт: 300с → 900с → 3600с.
 * Стартуем с короткого лимита (быстро), удлиняем только если полёт не завершён.
 */
function simulateAdaptive(upgrades, cards, opts) {
  const tiers = [300, 900, 3600]
  let r = null
  for (const maxTime of tiers) {
    r = simulate(upgrades, cards, { ...opts, maxTime })
    if (!r.maxTimeReached) break
  }
  return r
}

/* ================================================================
   FIND OPTIMUM
================================================================ */
async function findOptimumAsync(upgrades, cards, baseOpts, onProgress) {
  const results = []
  let best = null

  for (let angle = 0; angle <= 90; angle += 1) {
    const r = simulateAdaptive(upgrades, cards, {
      ...baseOpts,
      noseLiftEnabled: true,
      noseLiftAngle: angle,
    })
    results.push({ angle, distance: r.distance, truncated: r.maxTimeReached })
    // Не-обрезанный всегда выигрывает у обрезанного
    const better =
      !best ||
      (!r.maxTimeReached && (best.result.maxTimeReached || r.distance > best.distance)) ||
      (r.maxTimeReached === best.result.maxTimeReached && r.distance > best.distance)
    if (better) {
      best = { angle, distance: r.distance, result: r }
    }
    if (angle % 10 === 9) {
      onProgress?.(angle + 1)
      await new Promise((r) => setTimeout(r, 0))
    }
  }

  const noLift = simulateAdaptive(upgrades, cards, { ...baseOpts, noseLiftEnabled: false })
  return { results, best, noLift }
}

/* ================================================================
   SVG CHARTS
================================================================ */
const fmtAxis = (v) => {
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M'
  if (v >= 1e3) return Math.round(v / 1e3) + 'к'
  return Math.round(v)
}

function renderTrajectoryChart(trajectory) {
  const W = 440, H = 280
  const padL = 55, padR = 20, padT = 20, padB = 40
  const plotW = W - padL - padR
  const plotH = H - padT - padB

  let maxX = 0, maxY = 0, peakIdx = 0
  for (let i = 0; i < trajectory.length; i++) {
    const [tx, ty] = trajectory[i]
    if (tx > maxX) maxX = tx
    if (ty > maxY) { maxY = ty; peakIdx = i }
  }
  if (maxX <= 0) maxX = 1
  if (maxY <= 0) maxY = 1
  maxX *= 1.05
  maxY *= 1.08

  const toX = (v) => padL + (v / maxX) * plotW
  const toY = (v) => padT + (1 - v / maxY) * plotH

  const pts = trajectory.map(([tx, ty]) => `${toX(tx).toFixed(1)},${toY(ty).toFixed(1)}`).join(' ')

  const xTicks = []
  for (let i = 0; i <= 4; i++) {
    const v = (maxX * i) / 4
    const px = toX(v)
    xTicks.push(`<line x1="${px}" y1="${padT}" x2="${px}" y2="${padT + plotH}" stroke="rgba(255,255,255,0.06)"/>
      <text x="${px}" y="${padT + plotH + 15}" fill="rgba(255,255,255,0.45)" font-size="10" text-anchor="middle">${fmtAxis(v)}</text>`)
  }
  const yTicks = []
  for (let i = 0; i <= 4; i++) {
    const v = (maxY * i) / 4
    const px = toY(v)
    yTicks.push(`<line x1="${padL}" y1="${px}" x2="${padL + plotW}" y2="${px}" stroke="rgba(255,255,255,0.06)"/>
      <text x="${padL - 6}" y="${px + 3}" fill="rgba(255,255,255,0.45)" font-size="10" text-anchor="end">${fmtAxis(v)}</text>`)
  }

  const startPt = trajectory[0]
  const endPt = trajectory[trajectory.length - 1]
  const peakPt = trajectory[peakIdx]

  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg">
    ${xTicks.join('')}
    ${yTicks.join('')}
    <polyline points="${pts}" fill="none" stroke="#ffd75e" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${toX(startPt[0])}" cy="${toY(startPt[1])}" r="4" fill="#7dffa0"/>
    <circle cx="${toX(endPt[0])}" cy="${toY(endPt[1])}" r="4" fill="#ff7a7a"/>
    <circle cx="${toX(peakPt[0])}" cy="${toY(peakPt[1])}" r="4" fill="#ffd75e"/>
    <text x="${toX(peakPt[0])}" y="${toY(peakPt[1]) - 8}" fill="#ffd75e" font-size="10" font-weight="700" text-anchor="middle">${fmtAxis(peakPt[1])}</text>
    <text x="${padL + plotW / 2}" y="${H - 8}" fill="rgba(255,255,255,0.55)" font-size="11" text-anchor="middle">Дальность, м</text>
    <text x="14" y="${padT + plotH / 2}" fill="rgba(255,255,255,0.55)" font-size="11" text-anchor="middle" transform="rotate(-90 14 ${padT + plotH / 2})">Высота, м</text>
  </svg>`
}

function renderAngleChart(results, best) {
  const W = 440, H = 280
  const padL = 55, padR = 20, padT = 20, padB = 40
  const plotW = W - padL - padR
  const plotH = H - padT - padB

  let maxY = 0
  for (const r of results) if (r.distance > maxY) maxY = r.distance
  if (maxY <= 0) maxY = 1
  maxY *= 1.08

  const toX = (angle) => padL + (angle / 90) * plotW
  const toY = (dist) => padT + (1 - dist / maxY) * plotH

  const pts = results.map(r => `${toX(r.angle).toFixed(1)},${toY(r.distance).toFixed(1)}`).join(' ')

  const xTicks = []
  for (let a = 0; a <= 90; a += 15) {
    const px = toX(a)
    xTicks.push(`<line x1="${px}" y1="${padT}" x2="${px}" y2="${padT + plotH}" stroke="rgba(255,255,255,0.06)"/>
      <text x="${px}" y="${padT + plotH + 15}" fill="rgba(255,255,255,0.45)" font-size="10" text-anchor="middle">${a}°</text>`)
  }
  const yTicks = []
  for (let i = 0; i <= 4; i++) {
    const v = (maxY * i) / 4
    const px = toY(v)
    yTicks.push(`<line x1="${padL}" y1="${px}" x2="${padL + plotW}" y2="${px}" stroke="rgba(255,255,255,0.06)"/>
      <text x="${padL - 6}" y="${px + 3}" fill="rgba(255,255,255,0.45)" font-size="10" text-anchor="end">${fmtAxis(v)}</text>`)
  }

  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg">
    ${xTicks.join('')}
    ${yTicks.join('')}
    <polyline points="${pts}" fill="none" stroke="#c38bff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${toX(best.angle)}" cy="${toY(best.distance)}" r="5" fill="#ffd75e"/>
    <text x="${toX(best.angle)}" y="${toY(best.distance) - 10}" fill="#ffd75e" font-size="10" font-weight="700" text-anchor="middle">${best.angle}° · ${fmtM(best.distance)}</text>
    <text x="${padL + plotW / 2}" y="${H - 8}" fill="rgba(255,255,255,0.55)" font-size="11" text-anchor="middle">Угол подъёма носа, °</text>
    <text x="14" y="${padT + plotH / 2}" fill="rgba(255,255,255,0.55)" font-size="11" text-anchor="middle" transform="rotate(-90 14 ${padT + plotH / 2})">Дальность, м</text>
  </svg>`
}

document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'))
    document.querySelectorAll('.tab-content').forEach((c) => c.classList.remove('active'))
    tab.classList.add('active')
    document.getElementById(tab.dataset.tab).classList.add('active')
  })
})

function buildUpgradeInputs(containerId, prefix = '') {
  const $c = document.getElementById(containerId)
  $c.innerHTML = ''
  const updaters = []

  for (const u of CFG.UPGRADES) {
    const row = document.createElement('div')
    row.className = 'row'
    const maxLvl = u.maxLevel ?? 12
    const initLvl = CFG.GAME.initialUpgrades[u.key] ?? 1
    row.innerHTML = `
      <label>${u.icon} ${u.name}</label>
      <div style="display:flex;align-items:center;gap:12px">
        <input type="range" id="${prefix}${u.key}" min="1" max="${maxLvl}" value="${initLvl}" style="flex:1">
        <span class="value" id="${prefix}${u.key}-val">${initLvl}</span>
        <span class="spent" id="${prefix}${u.key}-spent" title="Всего потрачено на этот апгрейд"></span>
      </div>`
    $c.appendChild(row)

    const input = row.querySelector('input')
    const val = row.querySelector('.value')
    const spentEl = row.querySelector('.spent')

    const update = () => {
      const lvl = +input.value
      val.textContent = lvl
      const total = totalSpent(u, lvl)
      spentEl.textContent = total > 0 ? fmtSpent(total) : ''
      updateUpgradesTotal(prefix)
    }
    input.addEventListener('input', update)
    updaters.push(update)
  }

  // Итоговая строка — всегда внизу
  const totalRow = document.createElement('div')
  totalRow.className = 'row total-row'
  totalRow.innerHTML = `
    <label>💎 Итого вложено</label>
    <div style="text-align:right">
      <span class="total-val" id="${prefix}upgrades-total">—</span>
    </div>`
  $c.appendChild(totalRow)

  // Первичная отрисовка всех значений + итога
  for (const upd of updaters) upd()
}

function buildCardInputs(containerId, prefix = '') {
  const $c = document.getElementById(containerId)
  $c.innerHTML = ''
  for (const card of CFG.CARDS) {
    if (card.key === 'forsage') continue
    const row = document.createElement('div')
    row.className = 'row'
    row.innerHTML = `
      <label>${card.icon} ${card.name}</label>
      <div style="display:flex;align-items:center;gap:12px">
        <input type="number" class="input-num" id="${prefix}card-${card.key}" min="0" max="2" value="0">
        <span class="hint">${card.desc}</span>
      </div>`
    $c.appendChild(row)
  }
}

function buildOptsInputs(containerId, prefix = '') {
  const $c = document.getElementById(containerId)
  $c.innerHTML = ''

  const r1 = document.createElement('div')
  r1.className = 'row'
  r1.innerHTML = `
    <label>🚀 Форсаж (уровень)</label>
    <select id="${prefix}forsage-lvl">
      <option value="0">0 — нет способности</option>
      <option value="1">1 — ×2 тяга, 3с, КД 60</option>
      <option value="2">2 — ×3 тяга, 4с, КД 45</option>
    </select>`
  $c.appendChild(r1)

  const r2 = document.createElement('div')
  r2.className = 'row'
  r2.innerHTML = `
    <label>Стратегия PUSH</label>
    <div class="radio-group">
      <label><input type="radio" name="${prefix}throttle" value="always" checked> Всегда</label>
      <label><input type="radio" name="${prefix}throttle" value="never"> Никогда</label>
    </div>`
  $c.appendChild(r2)

  const r3 = document.createElement('div')
  r3.className = 'row'
  r3.innerHTML = `
    <label>Авто-подъём носа</label>
    <label class="check-label">
      <input type="checkbox" id="${prefix}nose-lift-enabled" checked>
      <span class="hint">Пока есть тяга — держать нос на угле N</span>
    </label>`
  $c.appendChild(r3)

  const r4 = document.createElement('div')
  r4.className = 'row'
  r4.innerHTML = `
    <label>Угол подъёма</label>
    <div style="display:flex;align-items:center;gap:12px">
      <input type="range" id="${prefix}nose-angle" min="0" max="90" step="1" value="45" style="flex:1">
      <span class="value" id="${prefix}nose-angle-val">45°</span>
    </div>`
  $c.appendChild(r4)

  const $angleSlider = document.getElementById(`${prefix}nose-angle`)
  const $angleVal = document.getElementById(`${prefix}nose-angle-val`)
  const $liftCheckbox = document.getElementById(`${prefix}nose-lift-enabled`)
  $angleSlider.addEventListener('input', () => {
    $angleVal.textContent = $angleSlider.value + '°'
  })
  $liftCheckbox.addEventListener('change', () => {
    $angleSlider.disabled = !$liftCheckbox.checked
    $angleVal.style.opacity = $liftCheckbox.checked ? '1' : '0.3'
  })
}

function readState(prefix = '') {
  const upgrades = {}
  for (const u of CFG.UPGRADES) {
    upgrades[u.key] = +document.getElementById(`${prefix}${u.key}`).value
  }
  const cards = {}
  for (const card of CFG.CARDS) {
    if (card.key === 'forsage') continue
    const el = document.getElementById(`${prefix}card-${card.key}`)
    cards[card.key] = el ? +el.value : 0
  }
  const forsageLevel = +document.getElementById(`${prefix}forsage-lvl`).value
  const throttle = document.querySelector(`input[name="${prefix}throttle"]:checked`).value
  const noseLiftEnabled = document.getElementById(`${prefix}nose-lift-enabled`).checked
  const noseLiftAngle = +document.getElementById(`${prefix}nose-angle`).value
  return {
    upgrades,
    cards,
    opts: { forsageLevel, boostThrottle: throttle, noseLiftEnabled, noseLiftAngle },
  }
}

function renderSingleResult(result, upgrades, cards, opts) {
  const $out = document.getElementById('single-results')

  const angleInfo = result.boostEndAngle !== null
    ? `Угол в конце тяги: <b>${result.boostEndAngle.toFixed(0)}°</b>`
    : `Тяга не использовалась`
  const timeWarn = result.maxTimeReached
    ? `<br><span style="color:#ffb84d">⚠️ Полёт не завершился за ${result.time.toFixed(0)} с — результат обрезан</span>`
    : ''

  $out.innerHTML = `
    <div class="result-box">
      <div class="result-item">
        <div class="result-value">${fmtM(result.distance)}</div>
        <div class="result-label">Дальность</div>
      </div>
      <div class="result-item">
        <div class="result-value">${fmtM(result.maxAltitude)}</div>
        <div class="result-label">Макс. высота</div>
      </div>
      <div class="result-item">
        <div class="result-value">${result.time.toFixed(1)} с</div>
        <div class="result-label">Время полёта</div>
      </div>
    </div>
    <div style="opacity:0.6;font-size:12px;margin-top:8px;text-align:center;line-height:1.6">
      Монет: <b style="color:#ffd75e">${Math.floor(result.distance)}</b> ·
      Макс. скорость: <b>${Math.round(result.maxSpeed)} м/с</b> ·
      Топливо сожжено: <b>${result.fuelUsed.toFixed(1)} с</b> ·
      Посадка на высоте: <b>${Math.round(result.landingTerrain)} м</b><br>
      ${angleInfo}${timeWarn}
    </div>`

  const rows = []
  for (const u of CFG.UPGRADES) {
    const lvl = upgrades[u.key]
    const maxLvl = u.maxLevel ?? 12
    if (lvl >= maxLvl) {
      rows.push(`<tr>
        <td>${u.icon} ${u.name}</td>
        <td class="num">${lvl}</td>
        <td class="num neutral">MAX</td>
        <td class="num neutral">—</td>
        <td class="num neutral">—</td>
      </tr>`)
      continue
    }
    const cost = CFG.RULES.upgradeCost(u, lvl)
    const nextResult = simulateAdaptive({ ...upgrades, [u.key]: lvl + 1 }, cards, opts)
    const gain = nextResult.distance - result.distance
    const roi = cost > 0 ? (gain / cost) * 1000 : 0
    const cls = roi > 30 ? 'good' : roi > 5 ? '' : 'bad'
    rows.push(`<tr>
      <td>${u.icon} ${u.name}</td>
      <td class="num">${lvl}</td>
      <td class="num">${fmtCost(cost)}</td>
      <td class="num ${cls}">${gain >= 0 ? '+' : ''}${fmtM(gain)}</td>
      <td class="num ${cls}">${roi.toFixed(1)}</td>
    </tr>`)
  }

  $out.innerHTML += `
    <div class="section-title">Что купить дальше? (следующий уровень)</div>
    <table>
      <thead><tr>
        <th>Апгрейд</th>
        <th style="text-align:right">Ур.</th>
        <th style="text-align:right">Цена</th>
        <th style="text-align:right">Прирост</th>
        <th style="text-align:right">м / 1000💰</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>`

  const $charts = document.getElementById('charts-row')
  $charts.style.display = 'grid'
  $charts.innerHTML = `
    <div class="chart-container">
      <div class="chart-title">✈️ Траектория полёта</div>
      ${renderTrajectoryChart(result.trajectory)}
    </div>`
}

function renderOptimum(optData) {
  const { results, best, noLift } = optData
  const $out = document.getElementById('single-results')
  const gain = best.distance - noLift.distance
  const gainPct = noLift.distance > 0 ? (gain / noLift.distance) * 100 : 0

  const truncCount = results.filter((r) => r.truncated).length
  const timeWarn = truncCount > 0
    ? `<div style="color:#ffb84d;font-size:11px;margin-top:6px">⚠️ ${truncCount} угл. обрезаны по времени (300→900→3600 с)</div>`
    : ''

  $out.innerHTML = `
    <div class="opt-summary">
      <div class="big">🎯 Оптимум: ${best.angle}°</div>
      <div class="sub">Дальность: <b style="color:#c38bff">${fmtM(best.distance)}</b></div>
      <div class="sub">
        Без подъёма: ${fmtM(noLift.distance)}
        · <span class="gain">${gain >= 0 ? '+' : ''}${fmtM(gain)} (${gainPct > 0 ? '+' : ''}${gainPct.toFixed(1)}%)</span>
      </div>
      ${timeWarn}
    </div>

    <div class="result-box" style="margin-top:12px">
      <div class="result-item">
        <div class="result-value purple">${fmtM(best.distance)}</div>
        <div class="result-label">Дальность (оптимум)</div>
      </div>
      <div class="result-item">
        <div class="result-value">${fmtM(best.result.maxAltitude)}</div>
        <div class="result-label">Макс. высота</div>
      </div>
      <div class="result-item">
        <div class="result-value">${best.result.time.toFixed(1)} с</div>
        <div class="result-label">Время полёта</div>
      </div>
    </div>

    <div style="opacity:0.6;font-size:12px;margin-top:8px;text-align:center;line-height:1.6">
      Монет: <b style="color:#ffd75e">${Math.floor(best.distance)}</b> ·
      Макс. скорость: <b>${Math.round(best.result.maxSpeed)} м/с</b> ·
      Топливо сожжено: <b>${best.result.fuelUsed.toFixed(1)} с</b> ·
      Угол в конце тяги: <b>${best.result.boostEndAngle !== null ? best.result.boostEndAngle.toFixed(0) + '°' : '—'}</b>
    </div>`

  const $charts = document.getElementById('charts-row')
  $charts.style.display = 'grid'
  $charts.innerHTML = `
    <div class="chart-container">
      <div class="chart-title">✈️ Траектория (оптимум ${best.angle}°)</div>
      ${renderTrajectoryChart(best.result.trajectory)}
    </div>
    <div class="chart-container">
      <div class="chart-title">📈 Дальность vs угол подъёма</div>
      ${renderAngleChart(results, best)}
    </div>`
}

function renderCompare(resA, resB) {
  const $out = document.getElementById('cmp-results')
  const diff = resB.distance - resA.distance
  const diffPct = resA.distance > 0 ? (diff / resA.distance) * 100 : 0
  const diffCls = Math.abs(diffPct) < 0.5 ? 'neutral' : diff > 0 ? 'good' : 'bad'

  $out.innerHTML = `
    <div class="result-box" style="grid-template-columns: repeat(3, 1fr)">
      <div class="result-item">
        <div class="result-value">${fmtM(resA.distance)}</div>
        <div class="result-label">A</div>
      </div>
      <div class="result-item">
        <div class="result-value">${fmtM(resB.distance)}</div>
        <div class="result-label">B</div>
      </div>
      <div class="result-item">
        <div class="result-value ${diffCls}">${diff > 0 ? '+' : ''}${fmtM(diff)}<br>
          <span style="font-size:18px">${diffPct > 0 ? '+' : ''}${diffPct.toFixed(1)}%</span>
        </div>
        <div class="result-label">B относительно A</div>
      </div>
    </div>
    <table style="margin-top:16px">
      <thead><tr><th></th><th style="text-align:right">A</th><th style="text-align:right">B</th></tr></thead>
      <tbody>
        <tr><td>Дальность</td><td class="num">${fmtM(resA.distance)}</td><td class="num">${fmtM(resB.distance)}</td></tr>
        <tr><td>Макс. высота</td><td class="num">${fmtM(resA.maxAltitude)}</td><td class="num">${fmtM(resB.maxAltitude)}</td></tr>
        <tr><td>Время полёта</td><td class="num">${resA.time.toFixed(1)} с</td><td class="num">${resB.time.toFixed(1)} с</td></tr>
        <tr><td>Макс. скорость</td><td class="num">${Math.round(resA.maxSpeed)} м/с</td><td class="num">${Math.round(resB.maxSpeed)} м/с</td></tr>
      </tbody>
    </table>`
}

function buildCompareColumn(containerId, prefix) {
  const $c = document.getElementById(containerId)
  $c.innerHTML = ''

  const $upg = document.createElement('div')
  $upg.id = `${containerId}-upg`
  $c.appendChild($upg)
  buildUpgradeInputs(`${containerId}-upg`, prefix)

  const $cards = document.createElement('div')
  $cards.id = `${containerId}-cards`
  $cards.style.marginTop = '12px'
  $c.appendChild($cards)
  buildCardInputs(`${containerId}-cards`, prefix)

  const $opts = document.createElement('div')
  $opts.id = `${containerId}-opts`
  $opts.style.marginTop = '12px'
  $c.appendChild($opts)
  buildOptsInputs(`${containerId}-opts`, prefix)
}

/* ================================================================
   INIT
================================================================ */
buildUpgradeInputs('upgrades-inputs')
buildCardInputs('cards-inputs')
buildOptsInputs('opts-inputs')
buildCompareColumn('upA', 'A-')
buildCompareColumn('upB', 'B-')

document.getElementById('sim-btn').addEventListener('click', () => {
  const { upgrades, cards, opts } = readState('')
  const result = simulateAdaptive(upgrades, cards, opts)
  renderSingleResult(result, upgrades, cards, opts)
})

document.getElementById('opt-btn').addEventListener('click', async () => {
  const btn = document.getElementById('opt-btn')
  const origText = btn.textContent
  btn.textContent = '⏳ 0/91…'
  btn.disabled = true
  await new Promise((r) => setTimeout(r, 20))

  try {
    const { upgrades, cards, opts } = readState('')
    const optData = await findOptimumAsync(upgrades, cards, opts, (done) => {
      btn.textContent = `⏳ ${done}/91…`
    })
    renderOptimum(optData)
  } finally {
    btn.textContent = origText
    btn.disabled = false
  }
})

document.getElementById('cmp-btn').addEventListener('click', () => {
  const stateA = readState('A-')
  const stateB = readState('B-')
  const resA = simulateAdaptive(stateA.upgrades, stateA.cards, stateA.opts)
  const resB = simulateAdaptive(stateB.upgrades, stateB.cards, stateB.opts)
  renderCompare(resA, resB)
})
</script>
